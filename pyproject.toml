[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chargescape"
version = "0.1.0"
description = "ChargeScape London: a spatial decision system for EV charging networks under uncertain demand"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Marija Ercegovac"}]
dependencies = [
  "pandas>=2.2", "numpy>=1.26", "pyarrow>=15", "geopandas>=1.0", "shapely>=2.0", "pyproj>=3.6",
  "h3>=4.0", "osmnx>=2.0", "networkx>=3.2", "python-igraph>=0.11",
  "scikit-learn>=1.4", "lightgbm>=4.3", "statsmodels>=0.14", "mapie>=0.8",
  "esda>=2.5", "libpysal>=4.10", "spopt>=0.6", "pulp>=2.8", "highspy>=1.7",
  "pydeck>=0.9", "folium>=0.16", "matplotlib>=3.8", "seaborn>=0.13", "contextily>=1.5", "mapclassify>=2.6",
  "requests>=2.31", "pyyaml>=6.0", "tqdm>=4.66", "duckdb>=1.0", "pyogrio>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "jupyter", "nbformat", "nbconvert", "shap", "streamlit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
