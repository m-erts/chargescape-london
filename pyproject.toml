[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chargescape"
version = "1.0.0"
description = "ChargeScape London: a spatial decision system for EV charging networks under uncertain demand"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Marija Ercegovac"}]
keywords = ["ev-charging", "geospatial", "h3", "facility-location", "operations-research", "urban-analytics", "london"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: GIS",
]
# Runtime: everything the feature, model, optimisation and map steps import.
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "scipy>=1.11",          # sparse MILP via scipy.optimize.milp (HiGHS), KD-trees
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj>=3.6",
  "pyogrio>=0.9",
  "mapclassify>=2.6",     # quantile / Fisher-Jenks classes in static maps
  "h3>=4.0",
  "osmnx>=2.0",
  "networkx>=3.2",
  "igraph>=0.11",         # many-to-many Dijkstra on the OSM drive graph
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "esda>=2.5",
  "libpysal>=4.10",
  "matplotlib>=3.8",
  "rasterio>=1.3",        # WorldPop population around stations
  "requests>=2.31",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
data = ["osmium>=3.7"]                                   # offline OSM PBF backend for `make data`
notebooks = ["jupyter", "nbformat>=5.9", "nbconvert>=7.0", "ipykernel", "shap>=0.44"]
reports = ["python-pptx>=0.6.23", "nbformat>=5.9"]
dev = ["pytest>=8", "ruff>=0.5"]
all = ["chargescape[data,notebooks,reports,dev]"]

[project.urls]
Homepage = "https://m-erts.github.io/chargescape-london/"
Repository = "https://github.com/m-erts/chargescape-london"
Slides = "https://m-erts.github.io/chargescape-london/slides/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
